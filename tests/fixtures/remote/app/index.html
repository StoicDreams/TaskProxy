<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fixture app</title>
    <base href="/" />
    <script type="text/javascript">
        // Task Proxy's index.html registers its own service worker like this, which the frame must not.
        if (location.protocol === 'http:' || location.protocol === 'https:') {
            navigator.serviceWorker.register(`service-worker.min.js`);
        }
    </script>
    <!-- A stylesheet before the stand-in deadlocked the frame, so the fixture has one where Task Proxy has one. -->
    <link href="/css/app.min.css" rel="stylesheet" />
    <script src="/app.min.js"></script>
</head>
<body>
    <h1 id="title">Fixture app</h1>
    <p id="route"></p>
    <p id="remote"></p>
    <p id="projects"></p>
    <p id="refused"></p>
    <p id="worker"></p>
    <p id="echo"></p>
    <ul id="events"></ul>
    <a id="second" href="/second">Second page</a>
    <p id="page"></p>
</body>
</html>
